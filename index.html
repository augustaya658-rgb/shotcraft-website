<script>

const input =
  document.getElementById("productInput");

const preview =
  document.getElementById("preview");

const img =
  document.getElementById("previewImg");

const generateBtn =
  document.getElementById("generateBtn");


// ========================================
// PRODUCT UPLOAD
// ========================================

input.addEventListener("change", () => {

  const file =
    input.files[0];

  if (!file) return;

  img.src =
    URL.createObjectURL(file);

  preview.classList.add(
    "has-image"
  );

  document.getElementById(
    "status"
  ).textContent =
    "● PRODUCT LOCKED";

  toast(
    "PRODUCT LOCKED → READY TO DIRECT"
  );

});


// ========================================
// TOAST
// ========================================

function toast(msg) {

  const t =
    document.getElementById("toast");

  t.textContent =
    msg;

  t.classList.add("show");

  clearTimeout(
    window.tt
  );

  window.tt =
    setTimeout(() => {

      t.classList.remove(
        "show"
      );

    }, 3200);

}


// ========================================
// IMAGE → COMPRESSED DATA URL
//
// Important:
// Original huge image ko directly
// server par nahi bhejenge.
//
// Browser mein high-quality resize/compress.
// Product detail preserve rahega.
// ========================================

function fileToDataURL(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => {

          const source =
            new Image();

          source.onload =
            () => {

              const MAX_SIZE =
                2400;

              let width =
                source.naturalWidth;

              let height =
                source.naturalHeight;

              // --------------------------------
              // RESIZE ONLY IF NEEDED
              // --------------------------------

              if (
                width > MAX_SIZE ||
                height > MAX_SIZE
              ) {

                if (
                  width > height
                ) {

                  height =
                    Math.round(
                      height *
                      MAX_SIZE /
                      width
                    );

                  width =
                    MAX_SIZE;

                } else {

                  width =
                    Math.round(
                      width *
                      MAX_SIZE /
                      height
                    );

                  height =
                    MAX_SIZE;

                }

              }

              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;

              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.imageSmoothingEnabled =
                true;

              ctx.imageSmoothingQuality =
                "high";

              // White background
              // helps PNG/transparency
              // behave consistently
              ctx.fillStyle =
                "#ffffff";

              ctx.fillRect(
                0,
                0,
                width,
                height
              );

              ctx.drawImage(
                source,
                0,
                0,
                width,
                height
              );

              // High quality JPEG
              const compressed =
                canvas.toDataURL(
                  "image/jpeg",
                  0.90
                );

              resolve(
                compressed
              );

            };

          source.onerror =
            () => {

              reject(
                new Error(
                  "Could not read product image"
                )
              );

            };

          source.src =
            reader.result;

        };

      reader.onerror =
        () => {

          reject(
            new Error(
              "Could not load image"
            )
          );

        };

      reader.readAsDataURL(
        file
      );

    }
  );

}


// ========================================
// RATIO
// ========================================

function getRatio() {

  const value =
    document.getElementById(
      "outputSpec"
    ).value;

  if (
    value.startsWith("9:16")
  ) {
    return "9:16";
  }

  if (
    value.startsWith("1:1")
  ) {
    return "1:1";
  }

  if (
    value.startsWith("16:9")
  ) {
    return "16:9";
  }

  return "4:5";

}


// ========================================
// PROMPT
// ========================================

function buildPrompt() {

  const shot =
    document.getElementById(
      "shotType"
    ).value;

  const environment =
    document.getElementById(
      "environment"
    ).value;

  const lighting =
    document.getElementById(
      "lighting"
    ).value;

  return `
Create a premium commercial product photograph
using the uploaded product as the exact product reference.

Preserve the product identity, geometry, proportions,
materials, colors, stones, details and design.

Do not redesign, replace or invent the product.

Shot direction: ${shot}.

Environment: ${environment}.

Lighting: ${lighting}.

Clean luxury art direction,
realistic materials,
professional studio photography,
refined composition,
premium international D2C advertising aesthetic.

The product must remain the clear hero
and look physically photographed,
not illustrated or CGI.

Do not add unnecessary text,
logos, labels or typography onto the product.

Keep the product complete,
recognizable and commercially usable.
`;

}


// ========================================
// GENERATE
// ========================================

async function generate() {

  const file =
    input.files[0];

  // --------------------------------
  // VALIDATION
  // --------------------------------

  if (!file) {

    toast(
      "UPLOAD A PRODUCT PHOTO FIRST"
    );

    return;
  }

  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    toast(
      "PLEASE UPLOAD AN IMAGE"
    );

    return;
  }


  const generating =
    document.getElementById(
      "generating"
    );

  const status =
    document.getElementById(
      "status"
    );

  const credits =
    document.getElementById(
      "credits"
    );


  // --------------------------------
  // UI START
  // --------------------------------

  generateBtn.disabled =
    true;

  generateBtn.style.opacity =
    ".55";

  generating.classList.add(
    "show"
  );

  status.textContent =
    "● GENERATING";

  toast(
    "CREATIVE → GENERATING · 4 CREDITS"
  );


  try {

    // =================================
    // COMPRESS PRODUCT IMAGE
    // =================================

    const imageBase64 =
      await fileToDataURL(
        file
      );


    console.log(
      "SHOTCRAFT → IMAGE PREPARED"
    );

    console.log(
      "SHOTCRAFT → IMAGE SIZE:",
      Math.round(
        imageBase64.length / 1024
      ),
      "KB"
    );


    // =================================
    // SEND TO BACKEND
    // =================================

    const response =
      await fetch(
        "/api/generate",
        {
          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              imageBase64,

              prompt:
                buildPrompt(),

              tier:
                "standard",

              ratio:
                getRatio()

            })
        }
      );


    // =================================
    // READ RESPONSE SAFELY
    // =================================

    const responseText =
      await response.text();

    let data = {};

    try {

      data =
        JSON.parse(
          responseText
        );

    } catch {

      data = {
        error:
          responseText
      };

    }


    // =================================
    // BACKEND ERROR
    // =================================

    if (
      !response.ok ||
      !data.imageUrl
    ) {

      const details =
        data.details
          ? typeof data.details === "string"
            ? data.details
            : JSON.stringify(
                data.details
              )
          : "";

      throw new Error(

        [
          data.error,
          details
        ]
          .filter(Boolean)
          .join(" — ")

          ||

          `Generation failed (${response.status})`

      );

    }


    // =================================
    // SUCCESS
    // =================================

    img.src =
      data.imageUrl;

    preview.classList.add(
      "has-image"
    );

    status.textContent =
      "● CREATIVE READY";


    // =================================
    // DEDUCT 4 CREDITS
    //
    // Only success.
    // Failure mein yahan code
    // kabhi execute nahi hota.
    // =================================

    const current =
      parseInt(
        credits.textContent,
        10
      );

    if (
      Number.isFinite(current) &&
      current >= 4
    ) {

      credits.textContent =
        String(
          current - 4
        );

    }


    toast(
      "CREATIVE READY → 4 CREDITS USED"
    );


    console.log(
      "SHOTCRAFT → GENERATION SUCCESS"
    );


  } catch (err) {

    // =================================
    // IMPORTANT:
    // FAILURE = ZERO CREDIT DEDUCTION
    // =================================

    console.error(
      "SHOTCRAFT GENERATION ERROR:",
      err
    );

    status.textContent =
      "● GENERATION FAILED";


    // Actual backend error screen par
    // dikhega. Ab "GENERATION FAILED"
    // ke peeche chhupayega nahi.

    toast(
      "FAILED → " +
      (
        err.message ||
        "UNKNOWN ERROR"
      )
    );

  } finally {

    // =================================
    // RESET UI
    // =================================

    generating.classList.remove(
      "show"
    );

    generateBtn.disabled =
      false;

    generateBtn.style.opacity =
      "";

  }

}


// ========================================
// MODAL
// ========================================

function openModal() {

  document
    .getElementById("modal")
    .classList.add(
      "show"
    );

}


function closeModal() {

  document
    .getElementById("modal")
    .classList.remove(
      "show"
    );

}


// ========================================
// EMAIL
// ========================================

function submitEmail() {

  const email =
    document
      .getElementById(
        "email"
      )
      .value
      .trim();


  if (
    !email ||
    !email.includes("@")
  ) {

    toast(
      "ENTER A VALID EMAIL"
    );

    return;

  }


  closeModal();

  toast(
    "ACCESS REQUEST RECEIVED ↗"
  );

}


// ========================================
// CLOSE MODAL WHEN CLICKING OUTSIDE
// ========================================

document
  .getElementById("modal")
  .addEventListener(
    "click",
    e => {

      if (
        e.target.id ===
        "modal"
      ) {

        closeModal();

      }

    }
  );


</script>
